version: '3.8'
services:
  api:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    networks:
      - app-network

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network

  mcp:
    build: ./mcp-server
    ports:
      - "3002:3002"
    environment:
      - WEBHOOK_URL=http://api:3001/webhook
      - MCP_PORT=3002
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
